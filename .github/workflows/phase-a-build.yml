name: Build Phase A firmware

on:
  push:
    paths:
      - app/**
      - .github/workflows/phase-a-build.yml
      - docs/**
      - README.md
  pull_request:
    paths:
      - app/**
      - .github/workflows/phase-a-build.yml
      - docs/**
      - README.md
  workflow_dispatch:

concurrency:
  group: phase-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize west workspace
        run: |
          cd "${GITHUB_WORKSPACE}"
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.7.0
          west update
          west zephyr-export

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION="0.16.8"
          SDK_DIR="/tmp/zephyr-sdk-${SDK_VERSION}"
          SDK_ARCHIVE="zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          SDK_URL="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/${SDK_ARCHIVE}"

          wget -q -O "/tmp/${SDK_ARCHIVE}" "${SDK_URL}"
          tar -xJf "/tmp/${SDK_ARCHIVE}" -C /tmp
          "${SDK_DIR}/setup.sh" -t arm-zephyr-eabi -h -c

      - name: Set SDK environment
        run: |
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_SDK_INSTALL_DIR=/tmp/zephyr-sdk-0.16.8" >> "$GITHUB_ENV"

      - name: Build Phase A app
        run: |
          cd "${GITHUB_WORKSPACE}"
          west build -s app -b nrf52840dk_nrf52840 -d build/phase_a

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-nrf52840dk_nrf52840
          path: |
            build/phase_a/zephyr/zephyr.elf
            build/phase_a/zephyr/zephyr.hex
            build/phase_a/zephyr/zephyr.bin
            build/phase_a/zephyr/.config
            build/phase_a/zephyr/zephyr.dts
            build/phase_a/zephyr/zephyr.map
